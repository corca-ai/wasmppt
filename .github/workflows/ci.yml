name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality / repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26.x
          cache: false
      - name: Install JavaScript quality tools
        run: npm ci
      - name: Lint JavaScript, TypeScript, Markdown, and shell
        run: npm run lint
      - name: Check repository contracts
        run: npm run check:contracts
      - name: Lint GitHub Actions workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: Check spelling
        uses: crate-ci/typos@8a48f81b6c64dcfea44b3633223084c4be58ac5f
      - name: Reject whitespace errors
        run: |
          empty_tree=$(git hash-object -t tree /dev/null)
          git diff --check "$empty_tree" HEAD

  wasm-build:
    name: Rust / Wasm release artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # dtolnay/rust-toolchain@1.88.0
        with:
          targets: wasm32-unknown-unknown
      - name: Restore Rust build inputs
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-build-${{ runner.os }}-${{ runner.arch }}-rust-1.88.0-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/*/Cargo.toml', 'rust-toolchain.toml', 'scripts/build-wasm-hosts.sh') }}
          restore-keys: |
            wasm-build-${{ runner.os }}-${{ runner.arch }}-rust-1.88.0-
      - name: Restore wasm-bindgen generator
        id: wasm-bindgen-cache
        uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.cargo/bin/wasm-bindgen
          key: wasm-bindgen-cli-${{ runner.os }}-${{ runner.arch }}-rust-1.88.0-0.2.127
      - name: Install matching wasm-bindgen generator
        if: steps.wasm-bindgen-cache.outputs.cache-hit != 'true'
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Check checked-in Wasm artifact provenance
        run: node scripts/check-wasm-artifact-manifest.mjs
      - name: Build the shared scalar Wasm host artifacts
        run: npm run build:wasm-hosts
      - name: Check generated Wasm bindings
        run: |
          git diff --exit-code -- \
            packages/wasmppt-worker/src/generated/wasmppt_wasm.js \
            packages/wasmppt-worker/src/generated/wasmppt_wasm.d.ts \
            packages/wasmppt-worker/src/generated/wasmppt_wasm_bg.wasm.d.ts \
            packages/wasmppt-worker/src/generated/metafile/wasmppt_metafile_wasm.js \
            packages/wasmppt-worker/src/generated/metafile/wasmppt_metafile_wasm.d.ts \
            packages/wasmppt-worker/src/generated/metafile/wasmppt_metafile_wasm_bg.wasm.d.ts \
            packages/wasmppt-worker/src/generated/shaper/wasmppt_shaper_wasm.js \
            packages/wasmppt-worker/src/generated/shaper/wasmppt_shaper_wasm.d.ts \
            packages/wasmppt-worker/src/generated/shaper/wasmppt_shaper_wasm_bg.wasm.d.ts
      - name: Report Wasm artifact size
        run: |
          node scripts/report-wasm-size.mjs target/wasm32-unknown-unknown/wasm-release/wasmppt_wasm.wasm
          node scripts/report-wasm-size.mjs target/wasm32-unknown-unknown/wasm-release/wasmppt_metafile_wasm.wasm
          node scripts/report-wasm-size.mjs target/wasm32-unknown-unknown/wasm-release/wasmppt_shaper_wasm.wasm
      - name: Publish the shared Wasm host artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: wasm-host-${{ github.sha }}
          path: packages/wasmppt-worker/src/generated/
          if-no-files-found: error
          retention-days: 7
      - name: Summarize Wasm evidence
        run: echo "[Wasm host artifact]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" >> "$GITHUB_STEP_SUMMARY"

  rust:
    name: Rust / native correctness
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-nextest@0.9.143
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check native workspace
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Test native workspace with nextest
        run: cargo nextest run --workspace --all-features --locked
      - name: Test Rust documentation
        run: cargo test --workspace --all-features --locked --doc
      - name: Lint native workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check Wasm workspace
        run: cargo check --workspace --all-features --locked --target wasm32-unknown-unknown

  coverage:
    name: Rust / core coverage ratchet
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install LLVM coverage support
        run: rustup component add llvm-tools-preview
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-llvm-cov@0.8.7
      - name: Measure the host-agnostic core
        run: npm run coverage:core
      - name: Publish coverage evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: core-coverage-${{ github.sha }}
          path: target/coverage
          if-no-files-found: error
          retention-days: 14
      - name: Summarize coverage evidence
        if: always()
        run: echo "[Core coverage artifact]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" >> "$GITHUB_STEP_SUMMARY"

  msrv:
    name: Rust / MSRV
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install MSRV
        run: |
          rustup toolchain install 1.85.1 --profile minimal
          rustup toolchain install 1.88.0 --profile minimal
      - name: Check primary workspace with MSRV
        run: >-
          cargo +1.85.1 check --workspace --all-targets --all-features --locked
          --exclude wasmppt-metafile --exclude wasmppt-metafile-wasm
      - name: Check optional metafile modules with their MSRV
        run: cargo +1.88.0 check -p wasmppt-metafile -p wasmppt-metafile-wasm --all-targets --locked

  boundaries-and-packages:
    name: Packages / TypeScript and tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Check package entry points and core boundary
        run: npm run check
      - name: Test repository tooling
        run: npm test
      - name: Build JavaScript packages
        run: npm run build

  host-adapters:
    name: Hosts / byte and visual parity
    needs: wasm-build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Download the shared Wasm host artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: wasm-host-${{ github.sha }}
          path: packages/wasmppt-worker/src/generated
      - name: Execute the shared native fixture
        env:
          WASMPPT_HOST_FIXTURE: fixtures/host-adapters/minimal.potx
        run: cargo test --locked -p wasmppt-native --test file_adapters
      - name: Generate native PPTX byte-parity evidence
        run: |
          mkdir -p target/host-parity
          xxd -r -p fixtures/host-adapters/parity.wppd.hex \
            > target/host-parity/parity.wppd
          cargo run --locked -p wasmppt-cli -- generate-payload \
            fixtures/host-adapters/minimal.potx \
            target/host-parity/native.pptx \
            target/host-parity/parity.wppd
      - name: Generate deterministic native deck evidence
        run: |
          mkdir -p target/deck-gates
          fixture_dir=$(mktemp -d)
          cargo run --locked -p wasmppt-deck --example write_gate_fixtures -- "$fixture_dir"
          cmp fixtures/deck-gates/starter.potx "$fixture_dir/starter.potx"
          cmp fixtures/deck-gates/deck-spec.wdsf "$fixture_dir/deck-spec.wdsf"
          cmp fixtures/deck-gates/atomic-overflow.wdsf "$fixture_dir/atomic-overflow.wdsf"
          cmp fixtures/deck-gates/corpus.json "$fixture_dir/corpus.json"
          cargo run --locked -p wasmppt-wasm --example deck_gate_native -- \
            fixtures/deck-gates target/deck-gates
      - name: Execute the shared workerd fixture
        run: |
          set -o pipefail
          npm test --workspace @corca-ai/wasmppt-worker 2>&1 \
            | tee target/host-parity/workerd.log
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Generate the pinned browser-comparison fixture
        run: |
          mkdir -p target/benchmarks
          npm ci --prefix benchmarks/comparisons/pptxgenjs --ignore-scripts
          npm ci --prefix benchmarks/comparisons/pptx-browser --ignore-scripts
          node benchmarks/prepare-browser-comparator.mjs
          node benchmarks/comparisons/pptxgenjs/run.mjs \
            10 3 target/benchmarks/pptxgenjs-text-10.pptx \
            > target/benchmarks/pptxgenjs.json
      - name: Execute the shared browser Worker fixture
        run: npm run test:browser --workspace @corca-ai/wasmppt
      - name: Enforce native, browser, and workerd deck parity
        run: >-
          node scripts/deck-gates.mjs
          --workerd-log=target/host-parity/workerd.log
          --output=target/deck-gates
      - name: Enforce native, browser, and workerd PPTX byte parity
        run: |
          node scripts/host-parity.mjs \
            --native=target/host-parity/native.pptx \
            --browser=target/host-parity/browser.pptx \
            --workerd-log=target/host-parity/workerd.log \
            --output=target/host-parity/report.json
      - name: Publish cross-host PPTX byte-parity evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: host-byte-parity-${{ github.sha }}
          path: target/host-parity
          if-no-files-found: error
          retention-days: 7
      - name: Publish deck compatibility evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: deck-compatibility-${{ github.sha }}
          path: target/deck-gates
          if-no-files-found: error
          retention-days: 14
      - name: Verify native display-list parity
        run: |
          cargo run --locked -p wasmppt-cli -- resolve fixtures/render/basic.pptx 0 \
            | tee target/native-display-signature.txt
          grep 'signature 0fcb609b5b81f3c8' target/native-display-signature.txt
      - name: Publish per-slide visual report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: visual-regression-${{ github.sha }}
          path: target/visual-report
          if-no-files-found: error
      - name: Summarize host evidence
        if: always()
        run: echo "[Host parity and visual artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" >> "$GITHUB_STEP_SUMMARY"

  pages-dogfood:
    name: Hosts / Pages dogfood
    needs: wasm-build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Download the shared Wasm host artifacts
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: wasm-host-${{ github.sha }}
          path: packages/wasmppt-worker/src/generated
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Build and exercise the static dogfood application
        run: |
          npm run build:pages
          npm run test:pages
      - name: Validate downloaded presentations with Microsoft Open XML SDK
        run: |
          for deck in target/pages-downloads/*.pptx
          do
            dotnet run --project tools/openxml-validator/OpenXmlValidator.csproj \
              --configuration Release -- "$deck"
          done
      - name: Upload GitHub Pages artifact
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: target/pages

  pages-deploy:
    name: Deploy / Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: pages-dogfood
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Deploy dogfood application to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5

  documentation:
    name: Quality / documentation graph
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install awiki
        run: cargo install --git https://github.com/corca-ai/awiki --rev f65f8c43dbf0300609bdfdf823c09cba370222c6 --locked awiki
      - name: Lint documentation graph
        run: awiki lint -root docs

  openxml-compatibility:
    name: Compatibility / Open XML SDK
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          dotnet-version: 8.0.x
      - name: Fetch and verify the pinned Apache POI corpus
        run: node scripts/fetch-corpus.mjs target/compat
      - name: Convert real POTX through a forward-only sink
        run: |
          cargo run --locked -p wasmppt-cli -- validate target/compat/bug59273.potx
          cargo run --locked -p wasmppt-cli -- \
            convert target/compat/bug59273.potx target/compat/generated.pptx
          cargo run --locked -p wasmppt-cli -- validate target/compat/generated.pptx
          cargo run --locked -p wasmppt-cli -- audit-macro-free target/compat/generated.pptx
          cargo run --locked -p wasmppt-native \
            --example write_table_continuation_fixture -- \
            target/compat/continued-table.pptx
          cargo run --locked -p wasmppt-deck-compose \
            --example write_compat_fixture -- \
            target/compat/deck-compose.pptx
          cargo run --locked -p wasmppt-wasm --example deck_gate_native -- \
            fixtures/deck-gates target/compat/deck-gate
          cargo run --locked -p wasmppt-cli -- \
            validate target/compat/continued-table.pptx
          cargo run --locked -p wasmppt-cli -- \
            validate target/compat/deck-compose.pptx
      - name: Validate output with Microsoft Open XML SDK
        run: |
          for deck in \
            target/compat/generated.pptx \
            target/compat/continued-table.pptx \
            target/compat/deck-compose.pptx \
            target/compat/deck-gate/native.pptx
          do
            dotnet run --project tools/openxml-validator/OpenXmlValidator.csproj \
              --configuration Release -- "$deck"
          done
      - name: Resolve a real-world slide without silent fallback
        run: |
          cargo run --locked -p wasmppt-cli -- resolve target/compat/generated.pptx 0
          for deck in \
            target/compat/SampleShow.pptx \
            target/compat/WithMaster.pptx \
            target/compat/bar-chart.pptx \
            target/compat/smartart-simple.pptx \
            target/compat/LIBRE_OFFICE-100610-0.pptx
          do
            cargo run --locked -p wasmppt-cli -- validate "$deck"
            cargo run --locked -p wasmppt-cli -- resolve "$deck" 0
          done
          cargo run --locked -p wasmppt-cli -- resolve \
            target/compat/smartart-simple.pptx 0 2>&1 \
            | tee target/compat/smartart-simple.resolve.txt
          grep 'unsupported-smart-art' target/compat/smartart-simple.resolve.txt

  licenses:
    name: Security / dependency policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-deny@0.19.8,cargo-machete@0.9.2
      - name: Check advisory, license, source, and duplicate policy
        run: cargo deny check
      - name: Reject unused dependencies
        run: cargo machete --skip-target-dir

  security-and-corpus:
    name: Security / corpus and fuzz compilation
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Verify fixture hashes, provenance, redistribution, and capabilities
        run: node --test scripts/corpus.test.mjs scripts/capabilities.test.mjs
      - name: Build and score the pull-request compatibility corpus
        run: |
          cargo build --locked -p wasmppt-cli
          node scripts/corpus-scorecard.mjs --output=target/corpus-scorecard-pr.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: corpus-scorecard-pr-${{ github.sha }}
          path: target/corpus-scorecard-pr.json
          if-no-files-found: error
      - name: Summarize corpus evidence
        if: always()
        run: echo "[PR corpus scorecard]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" >> "$GITHUB_STEP_SUMMARY"
      - name: Compile every fuzz surface
        run: cargo check --manifest-path crates/wasmppt-opc/fuzz/Cargo.toml --bins
      - name: Exercise stable XML and package security limits
        run: |
          cargo test --locked -p wasmppt-xml security_limits_fail_with_one_stable_code
          cargo test --locked -p wasmppt-opc package_limits_are_checked_before_entry_inflation
      - name: Prove macro and unknown-markup policies
        run: |
          cargo test --locked -p wasmppt-template potm_generation_strips_macros_and_injects_escaped_unicode
          cargo test --locked -p wasmppt-template potx_conversion_preserves_notes_and_unknown_payloads

  performance-contract:
    name: Performance / release contracts
    needs: wasm-build
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # dtolnay/rust-toolchain@1.85.1
        with:
          targets: wasm32-unknown-unknown
      - name: Install JavaScript and browser tooling
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Download the shared scalar Wasm release artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: wasm-host-${{ github.sha }}
          path: packages/wasmppt-worker/src/generated
      - name: Enforce native latency, memory, binary-size, and raw-copy budgets
        run: node benchmarks/run.mjs --ci
      - name: Run the pinned non-equivalent PptxGenJS generation comparator
        run: |
          npm ci --prefix benchmarks/comparisons/pptxgenjs --ignore-scripts
          npm ci --prefix benchmarks/comparisons/pptx-browser --ignore-scripts
          node benchmarks/prepare-browser-comparator.mjs
          node benchmarks/comparisons/pptxgenjs/run.mjs \
            10 10 target/benchmarks/pptxgenjs-text-10.pptx \
            | tee target/benchmarks/pptxgenjs.json
          cargo run --locked -p wasmppt-cli -- validate target/benchmarks/pptxgenjs-text-10.pptx
          cargo run --locked -p wasmppt-cli -- resolve target/benchmarks/pptxgenjs-text-10.pptx 0
      - name: Enforce browser scalar-Wasm budgets and preserve raw samples
        run: npm run test:browser --workspace @corca-ai/wasmppt
      - name: Enforce Cloudflare workerd budgets and preserve raw samples
        run: |
          mkdir -p target/benchmarks
          npm test --workspace @corca-ai/wasmppt-worker 2>&1 | tee target/benchmarks/workerd.log
          node benchmarks/extract-workerd.mjs \
            target/benchmarks/workerd.log target/benchmarks/workerd.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: performance-raw-${{ github.sha }}
          path: |
            target/benchmarks/*.json
            target/benchmarks/*.pptx
            target/benchmark-fixtures/*.potx
          if-no-files-found: error
      - name: Summarize performance evidence
        if: always()
        run: echo "[Performance artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" >> "$GITHUB_STEP_SUMMARY"
