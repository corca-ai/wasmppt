name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Check native workspace
        run: cargo check --workspace --all-targets --all-features --locked
      - name: Test native workspace
        run: cargo test --workspace --all-features --locked
      - name: Lint native workspace
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings
      - name: Check Wasm workspace
        run: cargo check --workspace --all-features --locked --target wasm32-unknown-unknown
      - name: Build release Wasm
        run: cargo build --profile wasm-release --locked --target wasm32-unknown-unknown -p wasmppt-wasm
      - name: Report Wasm artifact size
        run: node scripts/report-wasm-size.mjs target/wasm32-unknown-unknown/wasm-release/wasmppt_wasm.wasm

  msrv:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install MSRV
        run: rustup toolchain install 1.85.1 --profile minimal
      - name: Check workspace with MSRV
        run: cargo +1.85.1 check --workspace --all-targets --all-features --locked

  boundaries-and-packages:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Check package entry points and core boundary
        run: npm run check
      - name: Test repository tooling
        run: npm test
      - name: Build JavaScript packages
        run: npm run build

  host-adapters:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install JavaScript dependencies
        run: npm ci
      - name: Install matching wasm-bindgen generator
        run: cargo install wasm-bindgen-cli --version 0.2.127 --locked
      - name: Regenerate Wasm host artifacts
        run: |
          npm run build:wasm-hosts
          git diff --exit-code -- \
            packages/wasmppt-worker/src/generated/wasmppt_wasm.js \
            packages/wasmppt-worker/src/generated/wasmppt_wasm.d.ts \
            packages/wasmppt-worker/src/generated/wasmppt_wasm_bg.wasm.d.ts
      - name: Execute the shared native fixture
        env:
          WASMPPT_HOST_FIXTURE: fixtures/host-adapters/minimal.potx
        run: cargo test --locked -p wasmppt-native --test file_adapters
      - name: Execute the shared workerd fixture
        run: npm test --workspace @corca-ai/wasmppt-worker
      - name: Install browser runtime
        run: npx playwright install --with-deps chromium
      - name: Execute the shared browser Worker fixture
        run: npm run test:browser --workspace @corca-ai/wasmppt

  documentation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install awiki
        run: cargo install --git https://github.com/corca-ai/awiki --rev f65f8c43dbf0300609bdfdf823c09cba370222c6 --locked awiki
      - name: Lint documentation graph
        run: awiki lint -root docs

  openxml-compatibility:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Fetch pinned Apache POI POTX fixture
        run: |
          mkdir -p target/compat
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/apache/poi/fe4184d649c0f7950e3a610c7dbc0591b7a52e3e/test-data/slideshow/bug59273.potx \
            --output target/compat/bug59273.potx
          echo "a69207b33c69e171dd35fab165e498802a46759bca24f5eb614deb3503aa5ee6  target/compat/bug59273.potx" \
            | sha256sum --check --strict
          curl --fail --location --silent --show-error \
            https://raw.githubusercontent.com/apache/poi/fe4184d649c0f7950e3a610c7dbc0591b7a52e3e/test-data/slideshow/SampleShow.pptx \
            --output target/compat/SampleShow.pptx
          echo "bfb4b2f07c9233afd2f32aa5781d849d0c7d225bf03721a10becf487b481d828  target/compat/SampleShow.pptx" \
            | sha256sum --check --strict
      - name: Convert real POTX through a forward-only sink
        run: |
          cargo run --locked -p wasmppt-cli -- validate target/compat/bug59273.potx
          cargo run --locked -p wasmppt-cli -- \
            convert target/compat/bug59273.potx target/compat/generated.pptx
          cargo run --locked -p wasmppt-cli -- validate target/compat/generated.pptx
      - name: Validate output with Microsoft Open XML SDK
        run: >-
          dotnet run --project tools/openxml-validator/OpenXmlValidator.csproj
          --configuration Release -- target/compat/generated.pptx
      - name: Resolve a real-world slide without silent fallback
        run: |
          cargo run --locked -p wasmppt-cli -- resolve target/compat/generated.pptx 0
          cargo run --locked -p wasmppt-cli -- resolve target/compat/SampleShow.pptx 0

  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-deny
        run: cargo install cargo-deny --version 0.19.8 --locked
      - name: Check dependency policy
        run: cargo deny check
