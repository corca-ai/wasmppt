name: Full compatibility corpus

on:
  workflow_dispatch:
  schedule:
    - cron: '23 18 * * 2'

permissions:
  contents: read

jobs:
  scorecard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@1.85.0
      - run: npm ci
      - run: cargo build --locked -p wasmppt-cli
      - run: node scripts/corpus-scorecard.mjs --all --output=target/corpus-scorecard-all.json
      - uses: actions/upload-artifact@v7
        with:
          name: corpus-scorecard-all-${{ github.sha }}
          path: target/corpus-scorecard-all.json
          if-no-files-found: error
