name: Full compatibility corpus

on:
  workflow_dispatch:
  schedule:
    - cron: '23 18 * * 2'

permissions:
  contents: read

jobs:
  scorecard:
    name: Scheduled / full corpus scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - uses: dtolnay/rust-toolchain@2eae45db285e407f22119950686d47e1101e071b # dtolnay/rust-toolchain@1.85.1
      - run: npm ci
      - run: cargo build --locked -p wasmppt-cli
      - run: node scripts/corpus-scorecard.mjs --all --output=target/corpus-scorecard-all.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: corpus-scorecard-all-${{ github.sha }}
          path: target/corpus-scorecard-all.json
          if-no-files-found: error
      - name: Summarize corpus evidence
        if: always()
        run: echo "[Full corpus scorecard]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" >> "$GITHUB_STEP_SUMMARY"
