name: Office ground truth

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'crates/wasmppt-layout/**'
      - 'crates/wasmppt-display/**'
      - 'packages/wasmppt/**'
      - 'crates/wasmppt-deck/**'
      - 'crates/wasmppt-deck-template/**'
      - 'crates/wasmppt-deck-layout/**'
      - 'crates/wasmppt-deck-compose/**'
      - 'crates/wasmppt-wasm/**'
      - 'fixtures/deck-gates/**'
      - 'fixtures/render/**'
      - 'tools/office-consumers/**'
  release:
    types: [published]

permissions:
  contents: read

jobs:
  powerpoint:
    name: Release / PowerPoint ground truth
    runs-on: [self-hosted, Windows, X64, PowerPoint, ImageMagick]
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: npm
      - name: Render current Canvas output
        shell: pwsh
        run: |
          npm ci
          npx playwright install chromium
          $env:CI = "true"
          npm run test:browser --workspace @corca-ai/wasmppt
      - name: Open without repair and export PowerPoint ground truth
        shell: pwsh
        run: >-
          ./tools/office-consumers/powerpoint.ps1
          fixtures/render/basic.pptx target/powerpoint-ground-truth
      - name: Open the generated deck gate without repair and export PDF
        shell: pwsh
        run: >-
          ./tools/office-consumers/powerpoint.ps1
          target/deck-gates/browser.pptx target/powerpoint-deck-gate
      - name: Prove the visual gate rejects a one-pixel regression
        shell: pwsh
        run: ./tools/office-consumers/test-compare-visuals.ps1
      - name: Compare every slide against PowerPoint with declared tolerance
        shell: pwsh
        run: >-
          ./tools/office-consumers/compare-visuals.ps1
          target/powerpoint-ground-truth/slides target/visual-report
          target/powerpoint-ground-truth/visual-report.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: powerpoint-ground-truth-${{ github.sha }}
          path: |
            target/powerpoint-ground-truth
            target/powerpoint-deck-gate
            target/visual-report
          if-no-files-found: error
      - name: Summarize PowerPoint evidence
        run: echo "[PowerPoint artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" >> "$GITHUB_STEP_SUMMARY"

  libreoffice:
    name: Release / LibreOffice ground truth
    runs-on: [self-hosted, Linux, X64, LibreOffice]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Export with LibreOffice Impress
        run: ./tools/office-consumers/libreoffice.sh fixtures/render/basic.pptx target/libreoffice
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: libreoffice-${{ github.sha }}
          path: target/libreoffice
          if-no-files-found: error
      - name: Summarize LibreOffice evidence
        run: echo "[LibreOffice artifact]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" >> "$GITHUB_STEP_SUMMARY"

  keynote:
    name: Release / Keynote ground truth
    runs-on: [self-hosted, macOS, ARM64, Keynote]
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Export with Keynote
        run: |
          mkdir -p target/keynote
          osascript tools/office-consumers/keynote.applescript \
            fixtures/render/basic.pptx target/keynote/ground-truth.pdf
          test -s target/keynote/ground-truth.pdf
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: keynote-${{ github.sha }}
          path: target/keynote
          if-no-files-found: error
      - name: Summarize Keynote evidence
        run: echo "[Keynote artifact]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" >> "$GITHUB_STEP_SUMMARY"
