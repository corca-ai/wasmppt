name: Rust deep quality

on:
  workflow_dispatch:
  schedule:
    - cron: '41 17 * * 3'

permissions:
  contents: read

concurrency:
  group: rust-deep-quality-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fuzz:
    name: Scheduled / bounded fuzz targets
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned nightly toolchain
        run: rustup toolchain install nightly-2026-08-01 --profile minimal --no-self-update
      - uses: taiki-e/install-action@b20dedce73af6905cdc30d6611090c9b67557c8d # v2
        with:
          tool: cargo-fuzz@0.13.2
      - name: Run every fuzz target with a bounded budget
        env:
          WASMPPT_FUZZ_SECONDS: 30
        run: scripts/run-fuzz-ci.sh
      - name: Publish crash artifacts and corpus metadata
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: fuzz-${{ github.sha }}
          path: target/fuzz-artifacts
          if-no-files-found: error
          retention-days: 30
      - name: Summarize fuzz evidence
        if: always()
        run: echo "[Fuzz artifacts]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)" >> "$GITHUB_STEP_SUMMARY"

  miri:
    name: Scheduled / Miri core subset
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: nightly-2026-08-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned nightly toolchain with Miri
        run: >-
          rustup toolchain install nightly-2026-08-01 --profile minimal
          --component miri --no-self-update
      - name: Prepare Miri sysroot
        run: cargo miri setup
      - name: Exercise the documented Miri-compatible subset
        env:
          MIRIFLAGS: -Zmiri-strict-provenance
        run: |
          cargo miri test --locked -p wasmppt-xml --test tokens
          cargo miri test --locked -p wasmppt-template --lib payload::tests

  portable-native:
    name: Scheduled / native smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - name: Install pinned Rust toolchain
        run: rustup show
      - name: Run portable native adapter smoke tests
        env:
          WASMPPT_HOST_FIXTURE: fixtures/host-adapters/minimal.potx
        run: cargo test --locked -p wasmppt-native --test file_adapters
      - name: Validate a real package through the CLI
        run: cargo run --locked -p wasmppt-cli -- validate fixtures/render/basic.pptx
