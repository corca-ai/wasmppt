[workspace]
members = [
    "crates/wasmppt-cli",
    "crates/wasmppt-display",
    "crates/wasmppt-layout",
    "crates/wasmppt-opc",
    "crates/wasmppt-pml",
    "crates/wasmppt-template",
    "crates/wasmppt-wasm",
    "crates/wasmppt-xml",
]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/corca-ai/wasmppt"
authors = ["wasmppt contributors"]

[workspace.dependencies]
crc32fast = "1.5.0"
flate2 = { version = "1.1.9", default-features = false, features = ["rust_backend"] }
proptest = { version = "1.11.0", default-features = false, features = ["std"] }
wasm-bindgen = "0.2.127"
wasmppt-display = { path = "crates/wasmppt-display", version = "0.0.0" }
wasmppt-layout = { path = "crates/wasmppt-layout", version = "0.0.0" }
wasmppt-opc = { path = "crates/wasmppt-opc", version = "0.0.0" }
wasmppt-pml = { path = "crates/wasmppt-pml", version = "0.0.0" }
wasmppt-template = { path = "crates/wasmppt-template", version = "0.0.0" }
wasmppt-xml = { path = "crates/wasmppt-xml", version = "0.0.0" }

[workspace.lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = true

[profile.wasm-release]
inherits = "release"
lto = "fat"

[profile.wasm-small]
inherits = "release"
opt-level = "s"
lto = "fat"
