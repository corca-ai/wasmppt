[package]
name = "wasmppt-opc-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
wasmppt-opc = { path = ".." }
wasmppt-layout = { path = "../../wasmppt-layout" }
wasmppt-template = { path = "../../wasmppt-template" }
wasmppt-xml = { path = "../../wasmppt-xml" }

[[bin]]
name = "open_package"
path = "fuzz_targets/open_package.rs"
test = false
doc = false
bench = false

[[bin]]
name = "package_graph"
path = "fuzz_targets/package_graph.rs"
test = false
doc = false
bench = false

[[bin]]
name = "xml_tokens"
path = "fuzz_targets/xml_tokens.rs"
test = false
doc = false
bench = false

[[bin]]
name = "slide_geometry"
path = "fuzz_targets/slide_geometry.rs"
test = false
doc = false
bench = false

[[bin]]
name = "template_bindings"
path = "fuzz_targets/template_bindings.rs"
test = false
doc = false
bench = false

[workspace]
